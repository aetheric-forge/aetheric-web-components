# Bindings for the Decisions Office - HOW it runs in one specific deployment.
#
# Everything technology-specific that decisions-institution.yaml deliberately leaves out lives here
# instead: providers, connection details, and the concrete ambient-resolution path for each dependency.
# A different deployment of the same institution definition (different Campus, different infra) gets its
# own bindings file; the institution definition itself doesn't change.
#
# Grounded in adr-campus's current composition (ForgeCampusExtensions.AddForgeCampus): Draft Workspace is
# realized through Decisions' own Workbench, backed by Redis when configured and falling back to an
# in-memory provider otherwise. IArchive/ILibrary/IPostOffice/IRegistrar are not bound to a provider here
# at all - they're ambient capabilities resolved from wherever the parent Campus already provides them
# (per the institutional resolver's nearest-scope rule), so their binding is just the resolution path, not
# a provider choice. Decision Record isn't listed separately: it's realized entirely through the
# IArchive/ILibrary bindings below, not a distinct provider.
#
# Keys under `bindings` are the id slugs from decisions-institution.yaml's resources (e.g.
# `draft-workspace`), or contract names for dependencies (e.g. `IArchive`) - never display names.

institution: decisions
version: 1.0.0

deployment:
  name: forge-decisions

bindings:
  draft-workspace:
    provider: workbench
    stage: adr-campus-workbench
    backing: redis
    fallback: in-memory   # used when no Redis connection string is configured

  IArchive:
    source: campus.archive

  ILibrary:
    source: campus.library

  IPostOffice:
    source: campus.postoffice

  IRegistrar:
    source: campus.registrar

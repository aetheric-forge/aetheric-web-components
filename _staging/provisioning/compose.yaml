services:
  provisioning:
    build:
      context: .
    image: aetheric-provisioning:local
    restart: unless-stopped
    # Linux/Vulcan: only the host's reverse proxy can reach the HTTP listener.
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://127.0.0.1:5180
      ASPNETCORE_HTTPS_PORT: "443"
      BootstrapConnection__Authority: ${KEYCLOAK_AUTHORITY:-}
      BootstrapConnection__Realm: ${KEYCLOAK_REALM:-}
      BootstrapConnection__ClientId: ${KEYCLOAK_CLIENT_ID:-}
      BootstrapConnection__PublicOrigin: ${PROVISIONER_PUBLIC_ORIGIN:-}
      BootstrapConnection__AdminRole: ${FORGE_ADMIN_ROLE:-forge-admin}
      BootstrapConnection__StateDirectory: /home/app/.local/share/aetheric/bootstrap
      RootCredentials__Directory: /home/app/.local/share/aetheric/root-credentials
      RootCredentials__KeyDirectory: /home/app/.local/share/aetheric/root-key
    volumes:
      - bootstrap-state:/home/app/.local/share/aetheric/bootstrap
      - root-credentials:/home/app/.local/share/aetheric/root-credentials
      - root-key:/home/app/.local/share/aetheric/root-key
      - protection-keys:/home/app/.aspnet/DataProtection-Keys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bootstrap-state:
  protection-keys:
  root-credentials:
  root-key:
